# Lab 5.2 - least-privilege read-only access for desk support.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: desk-support, namespace: portal}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: desk-support, namespace: portal}
subjects:
- kind: Group
  name: servicedesk-l2
  apiGroup: rbac.authorization.k8s.io
roleRef: {kind: Role, name: desk-support, apiGroup: rbac.authorization.k8s.io}
